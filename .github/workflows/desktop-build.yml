name: Desktop internal test packages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            architecture: arm64
            media: darwin-arm64
          - runner: windows-2022
            platform: win
            architecture: x64
            media: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Create diagnostic directories
        run: mkdir -p output release
      - name: Verify runner architecture
        run: node -e "if(process.arch !== '${{ matrix.architecture }}')process.exit(1); console.log(process.platform,process.arch,process.version)"
      - name: Install dependencies
        run: npm ci 2>&1 | tee output/dependency-install.log
      - name: Prepare bundled media
        run: npm run media:prepare 2>&1 | tee output/media-prepare.log
      - name: Check bundled media
        run: npm run media:check 2>&1 | tee output/media-check.log
      - name: Full automated tests
        run: npm test 2>&1 | tee output/automated-tests.log
      - name: Build native packages
        run: npm run dist:${{ matrix.platform }} 2>&1 | tee output/package-build.log
      - name: Verify bundled modules and actual transcoding
        run: npm run verify:package 2>&1 | tee output/package-check.log
      - name: Create manual acceptance materials
        run: |
          npm run acceptance:fixtures
          node scripts/acceptance-materials.cjs
      - name: Upload packages and reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Videome-${{ matrix.media }}-${{ github.run_number }}
          retention-days: 30
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.json
            release/*.txt
            release/manual-acceptance/**
            output/*.log
      - name: Archive compatible media for local builds
        run: tar -czf release/media-${{ matrix.media }}.tar.gz -C media-bin ${{ matrix.media }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: media-${{ matrix.media }}-${{ github.run_number }}
          retention-days: 30
          path: release/media-*.tar.gz
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failure-${{ matrix.media }}-${{ github.run_number }}
          path: |
            release/*builder*.yml
            release/build-info.json
            output/**/*.json
            output/*.log

  release:
    name: Publish GitHub Release
    if: ${{ needs.package.result == 'success' }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Download package artifacts
        uses: actions/download-artifact@v7.0.2
        with:
          pattern: Videome-*
          path: release-downloads
          merge-multiple: false

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          find release-downloads -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release-assets/ \;

          shopt -s nullglob
          package_files=(release-assets/*.dmg release-assets/*.zip release-assets/*.exe)
          if (( ${#package_files[@]} == 0 )); then
            echo 'No desktop package files were found in the build artifacts.' >&2
            exit 1
          fi

          : > release-assets/SHA256SUMS.txt
          for file in "${package_files[@]}"; do
            (cd release-assets && sha256sum "$(basename "$file")") >> release-assets/SHA256SUMS.txt
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          title="Videome ${version} (build #${GITHUB_RUN_NUMBER})"
          notes="$(printf 'Automated desktop packages for commit %s.\n\nThis is a prerelease build for macOS Apple Silicon and Windows x64.' "$GITHUB_SHA")"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" release-assets/* \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
